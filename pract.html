<h1>Customize your dream car</h1>

   


    <div class="slider">
    <div id="dCanvas"></div>


        <!-- <h1>Customize your dream car</h1> -->
  </div>
  <div style="position:absolute; top:100px; left:12px; z-index:100; background:#fff; padding:8px; border-radius:6px;">
  <label>Pick Car Color:</label>
  <input type="color" id="colorPicker" value="#ff0000">
</div>
<!-- <input type="color" id="colorPicker"> -->

<select id="modelSelect">
  <option value="">Select Your Car</option>
  <option value="lambo">Lamborghini</option>
  <option value="bmw i8">bmw i8</option>
  <option value="ferrari">Ferrari</option>
  <option value="bmw">bmw i8 xs</option>
</select>


<!-- Wheels Section -->
<div class="wheels">
 <label for="wheelSelect">Choose Wheels:</label>
<select id="wheelSelect">
  <option value="">Select</option>
  <option value="wheel1">Wheel Style 1</option>
  <option value="wheel2">Wheel Style 2</option>
  <option value="wheel3">Wheel Style 3</option>
</select>
<button id="addWheelBtn">Add Wheels</button>
<button id="removeWheelBtn">Remove Wheels</button>

</div>
<br><br>

<!-- Spoiler Section -->
<div class="spoiler">
    <label for="spoilerSelect">Choose Spoiler:</label>
<select id="spoilerSelect">
  <option value="">Select</option>
  <option value="spoiler1">Spoiler 1</option>
  <option value="spoiler2">Spoiler 2</option>
</select>
<button id="addSpoilerBtn">Add Spoiler</button>
<button id="removeSpoilerBtn">Remove Spoiler</button>
</div>
<br><br><br>

<!-- sound section -->
<section class="sound-section">
    <h2 class="sound-title">🔊 Experience Real Car Engine Sounds</h2>
    <p class="sound-subtitle">Click a button to hear how different cars sound.</p>

    <div class="sound-buttons">

        <button class="sound-btn" onclick="playSound('sport')">
            Sport Exhaust
        </button>

        <button class="sound-btn" onclick="playSound('turbo')">
            Turbo Boost
        </button>

        <button class="sound-btn" onclick="playSound('electric')">
            Electric Car Sound
        </button>

        <button class="sound-btn" onclick="playSound('startup')">
            Engine Start-Up
        </button>

    </div>

    <!-- Audio Files -->

    <audio id="sport" src="sport car sound.mp3"></audio>
    <audio id="turbo" src="turbo-flutter-336362.mp3"></audio> 
    <audio id="electric" src="electric-car-393088.mp3"></audio> 
    <audio id="startup" src="car-engine-372477.mp3"></audio>
